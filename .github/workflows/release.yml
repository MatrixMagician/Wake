name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs the full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install the BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm linux-tools-common linux-tools-generic

      # Never ship a release that has not passed the gates. A flight recorder
      # with a data race is worse than no flight recorder.
      - name: Verify before releasing
        run: |
          make generate
          go vet ./...
          go test -race -count=1 ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
