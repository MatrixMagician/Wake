name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs the full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install the BPF toolchain
        run: |
          sudo apt-get update
          # linux-tools-generic ships the real bpftool under
          # /usr/lib/linux-tools/<kernel>/; the PATH wrapper it also installs
          # is useless on these runners because it demands a linux-tools
          # package for the Azure kernel they boot, which does not exist. The
          # Makefile finds the real binary. There is no standalone bpftool
          # package on noble: apt reports it as virtual and uninstallable.
          sudo apt-get install -y clang llvm libbpf-dev zstd linux-tools-common linux-tools-generic

      # Never ship a release that has not passed the gates. A flight recorder
      # with a data race is worse than no flight recorder.
      - name: Verify before releasing
        run: |
          make generate
          go vet ./...
          go test -race -count=1 ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
