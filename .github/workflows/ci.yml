# CI for Wake.
#
# Two things make this repo's CI unusual, and both are deliberate:
#
#  1. The unit tests never need a kernel or privileges. That is a design
#     constraint (CLAUDE.md), so the `test` job runs on a stock runner and any
#     future test that needs root will fail here rather than quietly become a
#     root-only test nobody runs.
#  2. The kernel-dependent tests are separated into `integration`, which needs
#     a BTF-capable kernel. GitHub's ubuntu runners have one, and the job
#     verifies that before running so a missing BTF reads as a skip with a
#     reason rather than a mystery failure.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must satisfy go.mod's own directive. `go-version-file` would be tidier, but
  # naming it here keeps the required version visible in the workflow; the
  # `go mod` check in the first job fails loudly if the two ever diverge.
  GO_VERSION: "1.26"

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install the BPF toolchain
        run: |
          sudo apt-get update
          # linux-tools-generic ships the real bpftool under
          # /usr/lib/linux-tools/<kernel>/; the PATH wrapper it also installs
          # is useless on these runners because it demands a linux-tools
          # package for the Azure kernel they boot, which does not exist. The
          # Makefile finds the real binary. There is no standalone bpftool
          # package on noble: apt reports it as virtual and uninstallable.
          sudo apt-get install -y clang llvm libbpf-dev zstd linux-tools-common linux-tools-generic

      - name: Generate vmlinux.h and the BPF objects
        run: make generate

      # Catch the CI pin drifting below what go.mod requires, which otherwise
      # surfaces as a confusing compile error in unrelated code. This must run
      # *after* generate: the loader embeds the compiled BPF objects, so a
      # build before they exist fails on the embed rather than on the version.
      - name: Check the toolchain satisfies go.mod
        run: go list -m -f '{{.GoVersion}}' && go build ./...

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      # -race is the point of this step: the recorder, ring, trigger engine and
      # control socket are all concurrent, and a data race in a flight recorder
      # is a corrupted flight record.
      - name: Unit tests
        run: go test -race -count=1 ./...

      # Fuzz the decoder briefly on every run. The corpus grows over time and
      # the seeds alone have already caught real bugs; a short run each build
      # is cheap insurance for the "decode is total" invariant.
      - name: Fuzz the decoder
        run: go test -run '^$' -fuzz FuzzDecodeNeverPanics -fuzztime 60s ./internal/decode/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install the BPF toolchain
        run: |
          sudo apt-get update
          # linux-tools-generic ships the real bpftool under
          # /usr/lib/linux-tools/<kernel>/; the PATH wrapper it also installs
          # is useless on these runners because it demands a linux-tools
          # package for the Azure kernel they boot, which does not exist. The
          # Makefile finds the real binary. There is no standalone bpftool
          # package on noble: apt reports it as virtual and uninstallable.
          sudo apt-get install -y clang llvm libbpf-dev zstd linux-tools-common linux-tools-generic
      - name: Generate
        run: make generate

      # Installed from source with this repo's toolchain rather than via
      # golangci-lint-action, whose prebuilt binaries are built with an older
      # Go than go.mod targets. golangci-lint refuses to run in that case, so
      # the action failed with a config-load error and never linted anything.
      - name: Install golangci-lint
        run: make tools-lint
      - name: Lint
        run: make lint

  integration:
    name: Integration tests (live kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install the BPF toolchain
        run: |
          sudo apt-get update
          # linux-tools-generic ships the real bpftool under
          # /usr/lib/linux-tools/<kernel>/; the PATH wrapper it also installs
          # is useless on these runners because it demands a linux-tools
          # package for the Azure kernel they boot, which does not exist. The
          # Makefile finds the real binary. There is no standalone bpftool
          # package on noble: apt reports it as virtual and uninstallable.
          sudo apt-get install -y clang llvm libbpf-dev zstd linux-tools-common linux-tools-generic

      # Fail early and legibly rather than deep inside the verifier.
      - name: Check the runner kernel can host Wake
        run: |
          uname -a
          test -f /sys/kernel/btf/vmlinux || {
            echo "::error::This runner's kernel has no BTF; Wake cannot run here."
            exit 1
          }

      - name: Generate and build
        run: make build

      - name: Doctor
        run: sudo ./wake doctor

      - name: Integration tests
        run: make integration

      - name: End-to-end smoke test
        run: sudo ./testdata/smoke.sh

  # The overhead budget is a stated requirement (SPEC.md §3), so it is measured
  # rather than assumed. It is not a gate on pull requests: shared runners are
  # too noisy for a 1% CPU threshold to mean anything. It runs on main so that a
  # regression is visible, and `make perf` remains the authoritative check on a
  # real box.
  perf:
    name: Overhead measurement (informational)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install the BPF toolchain
        run: |
          sudo apt-get update
          # linux-tools-generic ships the real bpftool under
          # /usr/lib/linux-tools/<kernel>/; the PATH wrapper it also installs
          # is useless on these runners because it demands a linux-tools
          # package for the Azure kernel they boot, which does not exist. The
          # Makefile finds the real binary. There is no standalone bpftool
          # package on noble: apt reports it as virtual and uninstallable.
          sudo apt-get install -y clang llvm libbpf-dev zstd linux-tools-common linux-tools-generic bc
      - name: Build
        run: make build
      - name: Measure
        run: sudo env "PATH=$PATH" DURATION=30 ./testdata/loadgen/measure.sh
      - name: Publish the measurement
        uses: actions/upload-artifact@v4
        with:
          name: perf
          path: docs/perf.md
