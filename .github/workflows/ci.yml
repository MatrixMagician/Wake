# CI for Wake.
#
# Two things make this repo's CI unusual, and both are deliberate:
#
#  1. The unit tests never need a kernel or privileges. That is a design
#     constraint (CLAUDE.md), so the `test` job runs on a stock runner and any
#     future test that needs root will fail here rather than quietly become a
#     root-only test nobody runs.
#  2. The kernel-dependent tests are separated into `integration`, which needs
#     a BTF-capable kernel. GitHub's ubuntu runners have one, and the job
#     verifies that before running so a missing BTF reads as a skip with a
#     reason rather than a mystery failure.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.23"

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install the BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm linux-tools-common linux-tools-generic

      - name: Generate vmlinux.h and the BPF objects
        run: make generate

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      # -race is the point of this step: the recorder, ring, trigger engine and
      # control socket are all concurrent, and a data race in a flight recorder
      # is a corrupted flight record.
      - name: Unit tests
        run: go test -race -count=1 ./...

      # Fuzz the decoder briefly on every run. The corpus grows over time and
      # the seeds alone have already caught real bugs; a short run each build
      # is cheap insurance for the "decode is total" invariant.
      - name: Fuzz the decoder
        run: go test -run '^$' -fuzz FuzzDecodeNeverPanics -fuzztime 60s ./internal/decode/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install the BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm linux-tools-common linux-tools-generic
      - name: Generate
        run: make generate
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  integration:
    name: Integration tests (live kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install the BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm linux-tools-common linux-tools-generic

      # Fail early and legibly rather than deep inside the verifier.
      - name: Check the runner kernel can host Wake
        run: |
          uname -a
          test -f /sys/kernel/btf/vmlinux || {
            echo "::error::This runner's kernel has no BTF; Wake cannot run here."
            exit 1
          }

      - name: Generate and build
        run: make build

      - name: Doctor
        run: sudo ./wake doctor

      - name: Integration tests
        run: make integration

      - name: End-to-end smoke test
        run: sudo ./testdata/smoke.sh

  # The overhead budget is a stated requirement (SPEC.md §3), so it is measured
  # rather than assumed. It is not a gate on pull requests: shared runners are
  # too noisy for a 1% CPU threshold to mean anything. It runs on main so that a
  # regression is visible, and `make perf` remains the authoritative check on a
  # real box.
  perf:
    name: Overhead measurement (informational)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install the BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm linux-tools-common linux-tools-generic bc
      - name: Build
        run: make build
      - name: Measure
        run: sudo env "PATH=$PATH" DURATION=30 ./testdata/loadgen/measure.sh
      - name: Publish the measurement
        uses: actions/upload-artifact@v4
        with:
          name: perf
          path: docs/perf.md
